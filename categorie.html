<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belgosweet — MidFi — Categorie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="categorie">

<div id="shell-header"></div>

<main>
  <div class="wrap">
    <div class="breadcrumb" id="cat-crumbs"></div>

    <!-- CATEGORIE-HERO -->
    <section class="cat-hero">
      <div class="cat-hero-media"><div class="ph">categoriebeeld</div></div>
      <div class="cat-hero-body">
        <p class="cat-hero-eyebrow">Shop</p>
        <h1 class="cat-hero-title" id="cat-hero-title">Categorie</h1>
        <div class="cat-hero-intro">
          <div class="line w100"></div>
          <div class="line w100"></div>
          <div class="line w50"></div>
        </div>
        <p class="cat-hero-meta" id="cat-hero-meta"></p>
      </div>
    </section>

    <div class="note">
      <strong>Max. één niveau diep.</strong> De huidige site nest tot drie à vier niveaus
      (bv. "Calendriers et agendas" duikt op als tussenlaag die nergens in het menu staat).
      Submerken en verpakking zijn hier filters binnen deze pagina, geen extra pagina-niveau.
    </div>

    <!-- Quick-filters + balk + filterpaneel + grid worden hier gerenderd -->
    <div id="cat-catalog"></div>
  </div>
</main>

<div id="shell-footer"></div>

<script src="data.js"></script>
<script src="app.js"></script>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belgosweet — HiFi — Offerte, stap 2</title>
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/colors.css">
<link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="offerte-gegevens">

<div id="shell-header"></div>

<main>
  <div class="wrap-wide">

    <div class="breadcrumb">
      <a href="index.html">Home</a><span class="sep">/</span>
      <a href="offerte.html">Offerte aanvragen</a><span class="sep">/</span><span>Je gegevens</span>
    </div>
    <h1 class="page-title">Je gegevens</h1>

    <div id="quote-steps"></div>

    <div id="quote-recap"></div>

    <form class="form-grid" id="quote-form">
      <div class="form-row"><label for="q-bedrijf">Bedrijf</label><input id="q-bedrijf" type="text" required></div>
      <div class="form-row"><label for="q-btw">Btw-nummer</label><input id="q-btw" type="text" placeholder="BE0000.000.000"></div>
      <div class="form-row"><label for="q-naam">Contactpersoon</label><input id="q-naam" type="text" required></div>
      <div class="form-row"><label for="q-mail">E-mail</label><input id="q-mail" type="email" required></div>
      <div class="form-row"><label for="q-tel">Telefoon</label><input id="q-tel" type="tel"></div>
      <div class="form-row">
        <label for="q-datum">Gewenste leverdatum</label>
        <input id="q-datum" type="date">
        <span class="hint">Bepaalt mee of iets uit voorraad kan of besteld moet worden.</span>
      </div>
      <div class="form-row full">
        <label for="q-perso">Personalisatie of opmerkingen</label>
        <textarea id="q-perso" placeholder="Logo, kleuren, sleeve, aantal per doos…"></textarea>
        <span class="hint">
          Beschrijf hier wat je in gedachten hebt. Stuur je logo mee per mail, dan
          krijg je een digitale proef voordat we in productie gaan.
        </span>
      </div>
      <div class="form-row full">
        <label class="form-check"><input type="checkbox" required> Ik ga akkoord met de <a href="info.html?p=voorwaarden" style="border-bottom:1px solid var(--rule-2);">algemene voorwaarden</a>.</label>
        <label class="form-check"><input type="checkbox"> Houd me op de hoogte van seizoensacties.</label>
        <button class="cta-btn primary" type="submit">Aanvraag versturen</button>
      </div>
    </form>

  </div>
</main>

<div id="shell-footer"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

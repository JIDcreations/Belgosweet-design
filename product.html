<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belgosweet — HiFi — Productdetail</title>
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/colors.css">
<link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="product">

<div id="shell-header"></div>

<main>
  <div class="wrap">
    <div class="breadcrumb" id="pdp-crumbs"></div>

    <div class="pdp">
      <div class="pdp-gallery" id="pdp-gallery"></div>
      <div class="pdp-info" id="pdp-info"></div>
    </div>

    <!-- PRODUCTINFO -->
    <section class="section">
      <div class="section-head">
        <div>
          <p class="eyebrow">Productinfo</p>
          <h2 class="section-title">Details</h2>
          <p class="section-sub">
            Samenstelling, afmetingen, verpakking en personalisatie — opengeklapt
            wat je nodig hebt, dicht wat niet.
          </p>
        </div>
      </div>
      <div id="pdp-accordion"></div>
    </section>

    <!-- GERELATEERD -->
    <section class="section">
      <div class="section-head">
        <div>
          <p class="eyebrow">Gerelateerd</p>
          <h2 class="section-title">Uit dezelfde categorie</h2>
        </div>
      </div>
      <div id="pdp-related"></div>
    </section>
  </div>
</main>

<div id="shell-footer"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

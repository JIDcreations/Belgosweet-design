<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belgosweet — HiFi — Shop</title>
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/colors.css">
<link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/type.css">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop">

<div id="shell-header"></div>

<main>
  <!-- .wrap-wide en niet .wrap: de zijmarges lopen hier gelijk met de home.
       .wrap kapt af op 1280px en .wrap-wide op 1600, dus boven 1280 stond de
       catalogus smaller ingesprongen dan de pagina waar je vandaan kwam. De
       gutter is in allebei dezelfde clamp(20px, 4vw, 56px); alleen de
       bovengrens verschilde. -->
  <div class="wrap-wide">
    <div class="breadcrumb" id="shop-crumbs"></div>

    <!-- KOP — zonder beeld: dit is de index, geen bestemming -->
    <section class="cat-hero plain">
      <div class="cat-hero-body">
        <p class="cat-hero-eyebrow">Catalogus</p>
        <h1 class="cat-hero-title">Alle producten</h1>
        <p class="cat-hero-facts" id="shop-hero-meta"></p>
      </div>
    </section>

    <!-- Balk + filterpaneel + productraster worden hier gerenderd -->
    <div id="shop-catalog"></div>
  </div>
</main>

<div id="shell-footer"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
